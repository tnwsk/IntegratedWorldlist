name: Release Geode Mod

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release mod
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ steps.mod-release.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: hiimjasmine00/release-geode-mod@main
        id: mod-release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

